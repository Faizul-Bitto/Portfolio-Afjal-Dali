<section class="min-h-screen pt-28 pb-16 flex items-center relative z-10">
      <div
        class="max-w-6xl mx-auto px-6 w-full grid md:grid-cols-12 gap-12 items-center"
      >
        <div class="md:col-span-7 space-y-6">
          <div class="reveal">
            <p class="section-label">Backend Developer</p>
            <h1 class="hero-name text-4xl sm:text-6xl">
              Afjal Hossain <br />
              <span class="accent">Dali</span>
            </h1>
          </div>

          <div class="reveal" style="transition-delay: 0.1s">
            <p class="hero-subtitle text-xl flex items-center gap-2">

              <span id="typing-text"
                >Backend Engineer • Full Stack Developer</span
              >

          </div>

          <div class="reveal" style="transition-delay: 0.2s">

          <div

                  .scrollIntoView({ behavior: 'smooth' })

              <i data-lucide="arrow-down-right" class="w-4 h-4"></i>

            <button
              onclick="
                document
                  .getElementById('contact')
                  .scrollIntoView({ behavior: 'smooth' })

              class="btn-outline"
            >
              <span>Get in Touch</span>
              <i data-lucide="mail" class="w-4 h-4"></i>
            </button>

        </div>

        <div class="md:col-span-5 flex justify-center reveal-scale">
          <div class="hero-img-wrap rounded-2xl">
